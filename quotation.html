<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><title>Quotation | Northcoast Entertainment</title><link rel="stylesheet" href="styles.css"></head><body><main class="quote-page"><div class="quote-toolbar"><a href="admin.html">← Admin</a><button onclick="window.print()">Print / Save PDF</button></div><section id="quote"></section></main><script>
const p=new URLSearchParams(location.search), id=p.get('id'), password=sessionStorage.getItem('northcoast_admin_password');
const root=document.getElementById('quote');
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function load(){if(!id||!password){root.innerHTML='<div class="quote-error">Open a quotation from the admin inbox.</div>';return}try{const r=await fetch('/.netlify/functions/admin-submissions',{headers:{'x-admin-password':password}});const j=await r.json();if(!r.ok)throw new Error(j.error);const s=(j.submissions||[]).find(x=>String(x.id)===id);if(!s)throw new Error('Enquiry not found');const d=s.data||{},m=s.management||{};const items=(m.items&&m.items.length?m.items:[{description:d.service||'Professional service',quantity:1,rate:m.quoteAmount||0}]);const rows=items.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.description)+'</td><td>'+esc(x.quantity)+'</td><td>'+esc(x.rate)+'</td><td>'+esc((Number(x.quantity||0)*Number(x.rate||0)).toLocaleString())+'</td></tr>').join('');const total=items.reduce((a,x)=>a+(Number(x.quantity)||0)*(Number(x.rate)||0),0);root.innerHTML='<div class="quote-document"><header><div class="brand"><span>NORTHCOAST</span><small>ENTERTAINMENT</small></div><div class="quote-title"><p>QUOTATION</p><strong>'+esc(m.quoteNumber||('NCE-'+new Date().getFullYear()+'-'+String(s.number||s.id).slice(-5)))+'</strong></div></header><div class="quote-meta"><div><b>Prepared for</b><br>'+esc(d.name||s.name||'Customer')+'<br>'+esc(d.phone||'')+'<br>'+esc(d.email||s.email||'')+'</div><div><b>Date</b><br>'+new Date().toLocaleDateString()+'<br><b>Status</b><br>'+esc(m.status||'QUOTED')+'</div></div><p>Thank you for your enquiry. Please find our quotation below.</p><table><thead><tr><th>#</th><th>Service / Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td colspan="4">TOTAL</td><td>'+esc((m.currency||'KES')+' '+total.toLocaleString())+'</td></tr></tfoot></table><div class="quote-notes"><b>Notes</b><p>'+esc(m.notes||'Quotation subject to final confirmation of scope and requirements.')+'</p></div><footer><p>Northcoast Entertainment</p><p>Creative • Digital • Business Solutions</p></footer></div>'}catch(e){root.innerHTML='<div class="quote-error">'+esc(e.message)+'</div>'}}load();
</script></body></html>
